<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skybound WebGL Diagnostic</title><style>body{margin:0;background:#0b1820;color:#eaf4f4;font-family:system-ui;padding:28px}canvas{width:min(900px,100%);height:420px;border:1px solid #39515b;border-radius:16px;display:block;margin-top:18px}.ok{color:#baf06f}.bad{color:#ff8c7a}pre{white-space:pre-wrap;background:#102631;padding:16px;border-radius:12px}</style></head><body><h1>Skybound WebGL Diagnostic</h1><p id="result">Testing…</p><pre id="info"></pre><canvas id="c" width="900" height="420"></canvas><script>(function(){var c=document.getElementById('c'),r=document.getElementById('result'),i=document.getElementById('info');var gl=null;try{gl=c.getContext('webgl2',{antialias:true})||c.getContext('webgl',{antialias:true})||c.getContext('experimental-webgl')}catch(e){}if(!gl){r.className='bad';r.textContent='WebGL did not start in this browser session.';i.textContent='Browser: '+navigator.userAgent;return}gl.viewport(0,0,c.width,c.height);gl.clearColor(.12,.32,.42,1);gl.clear(gl.COLOR_BUFFER_BIT);var dbg=gl.getExtension('WEBGL_debug_renderer_info');r.className='ok';r.textContent='WebGL is working. The blue-green canvas below was rendered by your GPU.';i.textContent='WebGL: '+gl.getParameter(gl.VERSION)+'\nRenderer: '+(dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'hidden by browser')+'\nBrowser: '+navigator.userAgent;})();</script></body></html>
