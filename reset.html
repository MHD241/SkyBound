<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Skybound</title><style>body{margin:0;background:#07131c;color:#e9f5f5;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:560px;padding:32px;border:1px solid #26404a;border-radius:18px;background:#0b1e29}b{color:#b9ef68}</style></head><body><div class="card"><h1>Resetting Skybound…</h1><p id="s">Removing old cached builds.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}document.getElementById('s').innerHTML='<b>Done.</b> Opening the known-working build…';setTimeout(()=>location.replace('./index.html?v=7-'+Date.now()),700)}catch(e){document.getElementById('s').textContent='Reset finished with a browser warning. Opening Skybound…';setTimeout(()=>location.replace('./index.html?v=7-'+Date.now()),700)}})();</script></body></html>
